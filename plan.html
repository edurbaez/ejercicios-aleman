<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

</head>

        <div class="nav-dropdown" id="navDropdown">
            <button class="nav-menu-btn" type="button" onclick="this.closest('.nav-dropdown').classList.toggle('open');event.stopPropagation()">Menú ▾</button>
            <div class="nav-dropdown-menu">
                <a href="A1.html">Vocabulario A1</a>
                <a href="A2.html">Vocabulario A2</a>
                <a href="B1.html">Vocabulario B1</a>
                <a href="palabrasB2.html">Vocabulario B2</a>
                <a href="C1.html">Vocabulario C1</a>
                <a href="C2.html">Vocabulario C2</a>
                <a href="diccionario.html">Diccionario</a>
                <a href="lectura veloz.html">Entrenamiento de lectura</a>
                <a href="chat-voz.html">Chat de Voz</a>
                <a href="corrector.html">Corrector</a>
                <a href="escritura.html">Escritura</a>
                <a href="kasus.html">Kasus-Trainer</a>
                <a href="gramatica.html">Gramática</a>
                <a href="chat-reformulaciones.html">Reformulaciones</a>
                <a href="plan.html" class="active">Plan 30 días</a>
            </div>
        </div>
        <div class="spacer"></div>
        <button id="auth-btn" title="Iniciar sesión" aria-label="Iniciar sesión"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
        <button id="darkModeBtn" onclick="toggleDarkMode()" title="Modo oscuro" aria-label="Modo oscuro"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
    </nav>
    <script>document.addEventListener('click',function(e){if(!e.target.closest('.nav-dropdown'))document.querySelectorAll('.nav-dropdown.open').forEach(function(d){d.classList.remove('open');});});</script>

    <main id="plan-main">
        <h1 id="plan-title">Plan 30 días</h1>

        <div id="plan-level-selector">
            <button class="plan-level-btn active" data-level="a1">A1</button>
            <button class="plan-level-btn" data-level="a2">A2</button>
            <button class="plan-level-btn" data-level="b1">B1</button>
            <button class="plan-level-btn" data-level="b2">B2</button>
            <button class="plan-level-btn" data-level="c1">C1</button>
            <button class="plan-level-btn" data-level="c2">C2</button>
        </div>

        <div id="plan-progress-bar-container">
            <span id="plan-progress-label">0 / 30 días completados</span>
            <div id="plan-progress-bar">
                <div id="plan-progress-fill"></div>
            </div>
        </div>

        <div id="plan-content">
            <div id="plan-calendar"></div>

            <aside id="plan-detail">
                <h2 id="plan-detail-day">Día 1</h2>
                <p id="plan-detail-focus"></p>
                <ul id="plan-detail-tasks"></ul>
                <button id="plan-complete-btn">Marcar como completado</button>
            </aside>
        </div>
    </main>

    <script src="plan.js"></script>
    <script>
        const ACCENT = '#1565C0';
        let activeLevel = 'a1';
        let selectedDay = null;

        function getProgressKey(level) {
            return 'plan_progress_' + level;
        }

        function loadProgress(level) {
            const raw = localStorage.getItem(getProgressKey(level));
            if (raw) {
                try { return JSON.parse(raw); } catch(e) {}
            }
            return new Array(30).fill(false);
        }

        function saveProgress(level, progress) {
            localStorage.setItem(getProgressKey(level), JSON.stringify(progress));
        }

        function getCurrentDayIndex(progress) {
            const first = progress.findIndex(function(v) { return !v; });
            return first === -1 ? 29 : first;
        }

        function renderProgressBar(progress) {
            const done = progress.filter(Boolean).length;
            document.getElementById('plan-progress-label').textContent = done + ' / 30 días completados';
            document.getElementById('plan-progress-fill').style.width = ((done / 30) * 100) + '%';
        }

        function renderCalendar(level, progress) {
            const plan = window.PLANS[level];
            const currentIdx = getCurrentDayIndex(progress);
            const calendar = document.getElementById('plan-calendar');
            calendar.innerHTML = '';

            plan.forEach(function(dayObj, i) {
                const cell = document.createElement('div');
                cell.className = 'plan-day';
                cell.dataset.index = i;

                if (progress[i]) cell.classList.add('completado');
                if (i === currentIdx && !progress[i]) cell.classList.add('actual');
                if (selectedDay === i) cell.classList.add('seleccionado');

                cell.innerHTML = '<span class="plan-day-num">' + dayObj.day + '</span>';
                cell.addEventListener('click', function() {
                    selectDay(i);
                });
                calendar.appendChild(cell);
            });
        }

        function selectDay(index) {
            selectedDay = index;
            const plan = window.PLANS[activeLevel];
            const progress = loadProgress(activeLevel);
            const dayObj = plan[index];
            const currentIdx = getCurrentDayIndex(progress);

            document.querySelectorAll('.plan-day').forEach(function(cell, i) {
                cell.classList.toggle('seleccionado', i === index);
            });

            document.getElementById('plan-detail-day').textContent = 'Día ' + dayObj.day;
            document.getElementById('plan-detail-focus').textContent = dayObj.focus;

            const tasksList = document.getElementById('plan-detail-tasks');
            tasksList.innerHTML = '';
            dayObj.tasks.forEach(function(task) {
                const li = document.createElement('li');
                li.innerHTML = '<a href="' + task.app + '">' + task.label + '</a> — ' + task.minutes + ' min';
                tasksList.appendChild(li);
            });

            const btn = document.getElementById('plan-complete-btn');
            if (progress[index]) {
                btn.textContent = 'Completado ✓';
                btn.classList.add('disabled');
                btn.disabled = true;
            } else if (index <= currentIdx) {
                btn.textContent = 'Marcar como completado';
                btn.classList.remove('disabled');
                btn.disabled = false;
            } else {
                btn.textContent = 'Completa los días anteriores primero';
                btn.classList.add('disabled');
                btn.disabled = true;
            }
        }

        function markComplete() {
            if (selectedDay === null) return;
            const progress = loadProgress(activeLevel);
            const currentIdx = getCurrentDayIndex(progress);
            if (selectedDay > currentIdx || progress[selectedDay]) return;

            progress[selectedDay] = true;
            saveProgress(activeLevel, progress);
            renderCalendar(activeLevel, progress);
            renderProgressBar(progress);
            selectDay(selectedDay);

            if (typeof window.logEvent === 'function') {
                window.logEvent('plan_day_complete', { level: activeLevel, day: selectedDay + 1 });
            }
        }

        function switchLevel(level) {
            activeLevel = level;
            selectedDay = null;

            document.querySelectorAll('.plan-level-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.level === level);
            });

            const progress = loadProgress(level);
            renderProgressBar(progress);
            renderCalendar(level, progress);

            const currentIdx = getCurrentDayIndex(progress);
            selectDay(currentIdx);

            document.getElementById('plan-detail').style.display = 'block';
        }

        document.querySelectorAll('.plan-level-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                switchLevel(btn.dataset.level);
            });
        });

        document.getElementById('plan-complete-btn').addEventListener('click', markComplete);

        function toggleDarkMode() {
            document.body.classList.toggle('dark');
            localStorage.setItem('darkMode_plan', document.body.classList.contains('dark'));
        }
        if (localStorage.getItem('darkMode_plan') === 'true') {
            document.body.classList.add('dark');
        }

        switchLevel('a1');
    </script>
</body>
</html>
