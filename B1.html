<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras B1</title>
    <link rel="manifest" href="manifest-b1.json">
    <meta name="theme-color" content="#388E3C">
    <link rel="apple-touch-icon" href="icon-b1.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</head>
<body id="page-b1">
    <nav id="navbar">
        <a href="palabrasB2.html">Inicio</a>
        <div class="nav-dropdown" id="navDropdown">
            <button class="nav-menu-btn" type="button" onclick="this.closest('.nav-dropdown').classList.toggle('open');event.stopPropagation()">Menú ▾</button>
            <div class="nav-dropdown-menu">
                <a href="lectura veloz.html">Lectura Veloz</a>
                <a href="diccionario.html">Diccionario</a>
                <a href="B1.html" class="active">B1</a>
                <a href="chat-voz.html">Chat de Voz</a>
                <a href="corrector.html">Corrector</a>
            </div>
        </div>
        <div class="spacer"></div>
        <button id="auth-btn" title="Iniciar sesión">👤</button>
        <button id="darkModeBtn" onclick="toggleDarkMode()" title="Modo oscuro">🌙</button>
    </nav>
    <script>document.addEventListener('click',function(e){if(!e.target.closest('.nav-dropdown'))document.querySelectorAll('.nav-dropdown.open').forEach(function(d){d.classList.remove('open');});});</script>

    <div class="app">

            <!-- ========================= -->
            <!--      SELECCIÓN MÚLTIPLE   -->
            <!-- ========================= -->

            <section class="game-section" id="seleccion-multiple">

                <div class="header">
                    <h1 class="title">Juego de Palabras</h1>
                </div>

                <!-- Panel de estadísticas -->
                <div class="panel">
                    <div class="card">
                        <div>Errores</div>
                        <div id="errores">0</div>
                    </div>

                    <div class="card">
                        <div>Aciertos</div>
                        <div id="aciertos">0</div>
                    </div>

                    <div class="card">
                        <div>Tiempo</div>
                        <div id="tiempo">3</div>
                    </div>
                </div>

                <!-- Palabra principal -->
                <div class="word-display" id="palabra"></div>

                <!-- Opciones -->
                <div class="options-grid">
                    <div class="option" id="op1"></div>
                    <div class="option" id="op2"></div>
                    <div class="option" id="op3"></div>
                    <div class="option" id="op4"></div>
                </div>
                <div style="text-align:center;margin-top:10px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
                    <button class="btn btn-secondary" id="btn-inverso" onclick="toggleModoInverso()">ES → DE</button>
                    <button class="btn btn-secondary" onclick="copiarErrores()">📋 Copiar errores</button>
                </div>

            </section>

            <!-- ========================= -->
            <!--     REPETICIÓN PALABRAS   -->
            <!-- ========================= -->

            <section class="game-section" id="repeticion-palabras" style="margin-top:40px;">

                <div class="header" style="display:flex;align-items:center;gap:12px;">
                    <h1 class="title">Repetición de Palabras</h1>
                    <span id="palabra-counter"
                          title="Palabras dichas en alemán. Doble clic para cambiar el límite."
                          style="font-family:monospace;font-size:1rem;letter-spacing:2px;cursor:pointer;user-select:none;background:#388E3C;color:#fff;padding:4px 10px;border-radius:12px;display:inline-block;">
                        000/100
                    </span>
                </div>

                <!-- Palabras -->
                <div class="panel" style="gap:20px;">
                    <div class="card word-display" id="p1"></div>
                    <div class="card word-display" id="p2"></div>
                </div>

                <!-- Controles inferiores -->
                <div class="footer-controls">
                    <button class="btn btn-secondary" id="auto">Auto: ON</button>
                    <button class="btn btn-danger" id="dual">DE</button>
                    <button class="btn" id="leer">Leer</button>
                </div>

            </section>

            <!-- ========================= -->
            <!--            LISTA          -->
            <!-- ========================= -->

            <section class="table-container">
                <div class="header">
                    <h1 class="title">Lista de Palabras</h1>
                </div>

                <input id="filter-lista" type="text" placeholder="Buscar palabra..." style="width:100%;padding:7px 10px;border:1px solid #ccc;border-radius:6px;margin-bottom:10px;box-sizing:border-box;font-size:14px;">

                <table id="lista">
                    <thead>
                        <tr>
                            <th>Uno</th>
                            <th>Dos</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- contenido dinámico -->
                    </tbody>
                </table>

            </section>

        </div>

    <script>
        window.APP_CONFIG = {
            appId:    'b1',
            dataFile: 'DataB1.json',
            limitKey: 'b1_palabras_limite',
            darkKey:  'darkMode_b1',
            swFile:   '/sw-b1.js',
            syncId:   'recordatorio-aleman-b1',
            accent:   '#388E3C'
        };
    </script>
    <script src="shared-game.js"></script>
</body>
</html>
