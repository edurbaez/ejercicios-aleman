<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clases — Profesor</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/config.js"></script>
  <script src="../grammar-data.js"></script>
  <script src="clases-a1.js"></script>
  <script src="clases-a2.js"></script>
  <script src="clases-b1.js"></script>
  <script src="clases-b2.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f7; color: #222; margin: 0; min-height: 100vh; }
    body.dark { background: #13141f; color: #dde1ec; }

    #loading-overlay { position: fixed; inset: 0; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 9999; font-size: 15px; color: #888; }
    body.dark #loading-overlay { background: #13141f; }

    .adm-header { background: #00695C; color: #fff; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,.25); height: 52px; }
    .adm-header-left { display: flex; align-items: center; gap: 14px; }
    .adm-logo { font-size: 16px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; }
    .adm-sep { width: 1px; height: 20px; background: rgba(255,255,255,.25); }
    .adm-header-actions { display: flex; gap: 8px; align-items: center; }
    .adm-btn { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); color: #fff; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; transition: background .15s; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; white-space: nowrap; }
    .adm-btn:hover { background: rgba(255,255,255,.24); }

    .adm-main { padding: 20px 24px 32px; max-width: 1100px; margin: 0 auto; }
    @media (max-width: 600px) { .adm-main { padding: 12px 10px 24px; } }

    .level-note { font-size: 12px; color: #888; margin-bottom: 18px; }
    body.dark .level-note { color: #6a7090; }

    #level-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .level-btn { padding: 6px 16px; border: 2px solid #00695C; border-radius: 20px; background: transparent; color: #00695C; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .15s, color .15s; }
    .level-btn:hover { background: #00695C; color: #fff; }
    .level-btn.active { background: #00695C; color: #fff; }
    body.dark .level-btn { border-color: #4db6ac; color: #4db6ac; }
    body.dark .level-btn:hover, body.dark .level-btn.active { background: #4db6ac; color: #13141f; }
    .level-btn:disabled { opacity: .4; cursor: not-allowed; }
    .level-btn:disabled:hover { background: transparent; color: #00695C; }
    body.dark .level-btn:disabled:hover { background: transparent; color: #4db6ac; }

    .week-card { background: #fff; border-radius: 12px; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 18px; }
    body.dark .week-card { background: #1e2035; }
    .week-title { font-size: 13px; font-weight: 700; color: #00695C; text-transform: uppercase; letter-spacing: .5px; margin: 0 0 14px; }
    body.dark .week-title { color: #4db6ac; }

    .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    @media (max-width: 700px) { .class-grid { grid-template-columns: 1fr; } }

    .class-col { border: 1px solid #eef0f5; border-radius: 10px; padding: 14px 16px; }
    body.dark .class-col { border-color: #2a2d45; }
    .class-header { cursor: pointer; user-select: none; }
    .class-day-label { font-size: 12px; font-weight: 700; color: #444; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    body.dark .class-day-label { color: #9aa0c0; }
    .toggle-arrow { display: inline-block; transition: transform .15s; margin-left: auto; color: #aaa; }
    .class-col.expanded .toggle-arrow { transform: rotate(90deg); }
    .class-detail { display: none; margin-top: 10px; }
    .class-col.expanded .class-detail { display: block; }

    .clase-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .3px; }
    .clase-badge-vivo { background: #e0f2f1; color: #00695C; }
    body.dark .clase-badge-vivo { background: #00302b; color: #4db6ac; }
    .clase-badge-auto { background: #f0f2f7; color: #888; }
    body.dark .clase-badge-auto { background: #252842; color: #6a7090; }
    .class-focus { font-size: 12px; color: #888; margin-bottom: 12px; }
    body.dark .class-focus { color: #6a7090; }

    .rule-block { padding: 10px 0; border-top: 1px solid #f5f6fa; }
    body.dark .rule-block { border-top-color: #252842; }
    .rule-block:first-of-type { border-top: none; padding-top: 0; }
    .rule-titulo { font-size: 13px; font-weight: 700; margin: 0 0 2px; }
    .rule-subtitulo { font-size: 11px; color: #888; margin: 0 0 6px; }
    body.dark .rule-subtitulo { color: #6a7090; }
    .rule-base { font-size: 12px; color: #444; margin: 0 0 6px; line-height: 1.4; }
    body.dark .rule-base { color: #ccd1e8; }
    .rule-tip { font-size: 12px; background: #e0f2f1; color: #00695C; padding: 6px 10px; border-radius: 6px; margin: 0; line-height: 1.4; }
    body.dark .rule-tip { background: #00302b; color: #4db6ac; }

    .extra-section { margin-top: 12px; padding-top: 10px; border-top: 1px solid #f5f6fa; }
    body.dark .extra-section { border-top-color: #252842; }

    .clase-regla { margin-top: 14px; padding-top: 12px; border-top: 1px solid #f5f6fa; }
    body.dark .clase-regla { border-top-color: #252842; }
    .clase-regla:first-child { margin-top: 0; padding-top: 0; border-top: none; }
    .clase-regla-titulo { font-size: 12px; font-weight: 700; color: #00695C; text-transform: uppercase; letter-spacing: .4px; margin: 0 0 6px; }
    body.dark .clase-regla-titulo { color: #4db6ac; }
    .clase-intro { font-size: 12px; color: #444; line-height: 1.5; margin: 0 0 8px; }
    body.dark .clase-intro { color: #ccd1e8; }

    .clase-practica { display: flex; flex-direction: column; gap: 4px; margin: 0 0 10px; }
    .clase-practica-item { display: flex; flex-direction: column; font-size: 12px; line-height: 1.4; gap: 1px; }
    .clase-practica-item .incorrecto { color: #c0392b; text-decoration: line-through; }
    body.dark .clase-practica-item .incorrecto { color: #e57373; }
    .clase-practica-item .correcto { color: #00695C; font-weight: 500; }
    body.dark .clase-practica-item .correcto { color: #4db6ac; }

    .clase-paso { margin: 0 0 8px; }
    .clase-paso-titulo { font-size: 12px; font-weight: 700; margin: 0 0 3px; }
    .clase-paso-texto { font-size: 12px; color: #444; line-height: 1.5; margin: 0 0 6px; }
    body.dark .clase-paso-texto { color: #ccd1e8; }

    .clase-tabla { width: 100%; border-collapse: collapse; font-size: 11px; margin: 0 0 6px; }
    .clase-tabla th, .clase-tabla td { border: 1px solid #eef0f5; padding: 4px 6px; text-align: left; }
    body.dark .clase-tabla th, body.dark .clase-tabla td { border-color: #2a2d45; }
    .clase-tabla th { background: #f5f6fa; font-weight: 600; }
    body.dark .clase-tabla th { background: #252842; }

    .clase-resumen { font-size: 12px; background: #e0f2f1; color: #00695C; padding: 6px 10px; border-radius: 6px; margin: 6px 0 0; line-height: 1.4; }
    body.dark .clase-resumen { background: #00302b; color: #4db6ac; }
  </style>
</head>
<body>

<div id="loading-overlay">Verificando acceso…</div>

<div id="teacher-app" style="display:none">

  <div class="adm-header">
    <div class="adm-header-left">
      <a href="/" class="adm-btn" style="gap:4px">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Inicio
      </a>
      <div class="adm-sep"></div>
      <span class="adm-logo">Clases — Profesor</span>
    </div>
    <div class="adm-header-actions">
      <button class="adm-btn" onclick="toggleDark()">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        Oscuro
      </button>
      <button class="adm-btn" onclick="signOut()">Salir</button>
    </div>
  </div>

  <div class="adm-main">
    <div id="level-selector"></div>
    <p class="level-note" id="level-note"></p>
    <div id="weeks-container"></div>
  </div>
</div>

<script>
  const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

  function toggleDark() {
    const dark = document.body.classList.toggle('dark');
    localStorage.setItem('darkMode_teacher', dark ? '1' : '0');
  }
  if (localStorage.getItem('darkMode_teacher') === '1') document.body.classList.add('dark');

  async function signOut() {
    await sb.auth.signOut();
    location.href = '/';
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  const TEACHER_LEVELS = [
    { key: 'a1', label: 'A1', grammarKey: 'A1', available: true },
    { key: 'a2', label: 'A2', grammarKey: 'A2', available: true },
    { key: 'b1', label: 'B1', grammarKey: 'B1', available: true },
    { key: 'b2', label: 'B2', grammarKey: 'B2', available: true },
    { key: 'c1', label: 'C1', grammarKey: 'C1', available: false },
    { key: 'c2', label: 'C2', grammarKey: 'C2', available: false },
  ];

  function currentLevelConfig() {
    return TEACHER_LEVELS.find(l => l.key === currentLevel) || TEACHER_LEVELS.find(l => l.key === 'b1');
  }

  const savedLevel = localStorage.getItem('teacher_level');
  let currentLevel = (TEACHER_LEVELS.find(l => l.key === savedLevel && l.available) || TEACHER_LEVELS.find(l => l.key === 'b1')).key;

  function selectLevel(key) {
    const cfg = TEACHER_LEVELS.find(l => l.key === key);
    if (!cfg || !cfg.available) return;
    currentLevel = key;
    localStorage.setItem('teacher_level', key);
    renderLevelSelector();
    updateLevelNote();
    renderWeeks();
  }

  function renderLevelSelector() {
    document.getElementById('level-selector').innerHTML = TEACHER_LEVELS.map(l => `
      <button class="level-btn ${l.key === currentLevel ? 'active' : ''}"
        ${l.available ? '' : 'disabled'}
        title="${l.available ? '' : 'Aún no disponible — plan.js de este nivel pendiente'}"
        onclick="selectLevel('${l.key}')">${l.label}</button>
    `).join('');
  }

  function updateLevelNote() {
    const cfg = currentLevelConfig();
    document.getElementById('level-note').textContent =
      `Nivel ${cfg.label} — los 30 días del plan de autoestudio. Los días marcados 🟢 Clase en vivo son martes/jueves (mapeo fijo: martes = día 2 de cada semana, jueves = día 4); el resto son días de autoestudio (📖) para los que igual conviene tener contenido de apoyo preparado.`;
  }

  function ruleById(id) {
    const grammarKey = currentLevelConfig().grammarKey;
    return ((GRAMMAR_DATA && GRAMMAR_DATA[grammarKey]) || []).find(r => r.id === id);
  }

  function renderRule(id) {
    const r = ruleById(id);
    if (!r) return `<div class="rule-block"><p class="rule-base">Regla no encontrada: ${esc(id)}</p></div>`;
    return `<div class="rule-block">
      <p class="rule-titulo">${esc(r.titulo)}</p>
      <p class="rule-subtitulo">${esc(r.subtitulo)}</p>
      <p class="rule-base">${esc(r.regla_base)}</p>
      ${r.tip ? `<p class="rule-tip">💡 ${esc(r.tip)}</p>` : ''}
    </div>`;
  }

  function renderTabla(tabla) {
    if (!tabla) return '';
    return `<table class="clase-tabla">
      <thead><tr>${tabla.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${tabla.rows.map(row => `<tr>${row.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>`;
  }

  function renderReglaContenido(regla) {
    const r = ruleById(regla.ruleId);
    const titulo = r ? r.titulo : regla.ruleId;
    let html = `<div class="clase-regla">
      <p class="clase-regla-titulo">${esc(titulo)}</p>`;

    if (regla.intro) {
      html += `<p class="clase-intro">${esc(regla.intro)}</p>`;
    }

    if (regla.practica && regla.practica.length) {
      html += `<div class="clase-practica">
        ${regla.practica.map(p => `<div class="clase-practica-item">
          <span class="incorrecto">✗ ${esc(p.incorrecto)}</span>
          <span class="correcto">✓ ${esc(p.correcto)}</span>
        </div>`).join('')}
      </div>`;
    }

    if (regla.pasos && regla.pasos.length) {
      html += regla.pasos.map(paso => `<div class="clase-paso">
        <p class="clase-paso-titulo">${esc(paso.titulo)}</p>
        ${paso.texto ? `<p class="clase-paso-texto">${esc(paso.texto)}</p>` : ''}
        ${renderTabla(paso.tabla)}
      </div>`).join('');
    }

    if (regla.resumen) {
      html += `<p class="clase-resumen">📌 ${esc(regla.resumen)}</p>`;
    }

    html += `</div>`;
    return html;
  }

  function renderContenido(contenido) {
    if (!contenido || !contenido.reglas || !contenido.reglas.length) return '';
    return `<div class="extra-section">${contenido.reglas.map(renderReglaContenido).join('')}</div>`;
  }

  function renderClassCol(cls) {
    const badge = cls.esClaseEnVivo
      ? `<span class="clase-badge clase-badge-vivo">🟢 Clase en vivo</span>`
      : `<span class="clase-badge clase-badge-auto">📖 Autoestudio</span>`;
    return `<div class="class-col">
      <div class="class-header" onclick="this.closest('.class-col').classList.toggle('expanded')">
        <div class="class-day-label">Día ${cls.day} ${badge}<span class="toggle-arrow">▸</span></div>
        <div class="class-focus">${esc(cls.focus)}</div>
      </div>
      <div class="class-detail">
        ${cls.ruleIds.map(renderRule).join('')}
        ${renderContenido(cls.contenido)}
      </div>
    </div>`;
  }

  function renderWeeks() {
    const days = (window.TEACHER_CLASES && window.TEACHER_CLASES[currentLevel]) || [];
    const bySemana = {};
    days.forEach(d => {
      (bySemana[d.semana] = bySemana[d.semana] || []).push(d);
    });
    const semanas = Object.keys(bySemana).map(Number).sort((a, b) => a - b);
    document.getElementById('weeks-container').innerHTML = semanas.map(semana => `
      <div class="week-card">
        <p class="week-title">Semana ${semana}</p>
        <div class="class-grid">
          ${bySemana[semana].map(renderClassCol).join('')}
        </div>
      </div>
    `).join('');
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.href = '/'; return; }

    const { data: profile } = await sb
      .from('profiles')
      .select('role')
      .eq('id', session.user.id)
      .maybeSingle();

    if (!profile || profile.role !== 'admin') { location.href = '/'; return; }

    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('teacher-app').style.display = 'block';

    renderLevelSelector();
    updateLevelNote();
    renderWeeks();
  }

  init();
</script>
</body>
</html>
