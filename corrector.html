<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrector de Alemán</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</head>
<body id="page-cor">
    <nav id="navbar">
        <a href="/">Inicio</a>
        <div class="nav-dropdown" id="navDropdown">
            <button class="nav-menu-btn" type="button" onclick="this.closest('.nav-dropdown').classList.toggle('open');event.stopPropagation()">Menú ▾</button>
            <div class="nav-dropdown-menu">
                <a href="palabrasB2.html">Vocabulario B2</a>
                <a href="B1.html">Vocabulario B1</a>
                <a href="diccionario.html">Diccionario</a>
                <a href="lectura veloz.html">Lectura Veloz</a>
                <a href="chat-voz.html">Chat de Voz</a>
                <a href="corrector.html" class="active">Corrector</a>
                <a href="kasus.html">Kasus-Trainer</a>
                <a href="gramatica.html">Gramática</a>
                <a href="chat-reformulaciones.html">Reformulaciones</a>
            </div>
        </div>
        <div class="spacer"></div>
        <button id="auth-btn" title="Iniciar sesión" aria-label="Iniciar sesión"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
        <button id="darkModeBtn" onclick="toggleDarkMode()" title="Modo oscuro" aria-label="Modo oscuro"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
    </nav>
    <script>document.addEventListener('click',function(e){if(!e.target.closest('.nav-dropdown'))document.querySelectorAll('.nav-dropdown.open').forEach(function(d){d.classList.remove('open');});});</script>

    <div class="cor-container">
        <div class="cor-header">
            <h1>Corrector de Alemán</h1>
            <p>Sube una foto de tu texto y recibe correcciones gramaticales</p>
        </div>

        <!-- Selector de tipo -->
        <div class="cor-type-selector">
            <button class="cor-type-btn active" data-type="tarea">Tarea</button>
            <button class="cor-type-btn" data-type="carta">Carta</button>
            <button class="cor-type-btn" data-type="frases">Frases sueltas</button>
        </div>

        <!-- Zona de upload -->
        <div class="cor-upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none">
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">

            <div class="cor-upload-placeholder" id="uploadPlaceholder">
                <div class="cor-upload-icon">📷</div>
                <p>Arrastra una imagen aquí o</p>
                <div class="cor-upload-btns">
                    <button class="cor-btn cor-btn-outline" onclick="document.getElementById('fileInput').click()">Seleccionar archivo</button>
                    <button class="cor-btn cor-btn-outline" onclick="document.getElementById('cameraInput').click()">Usar cámara</button>
                </div>
                <p class="cor-upload-hint">JPG, PNG o WebP · máx. 5 MB</p>
            </div>

            <div class="cor-preview-wrap" id="previewWrap" style="display:none">
                <img id="previewImg" class="cor-preview-img" alt="Vista previa">
                <button class="cor-remove-btn" id="removeBtn" title="Quitar imagen" aria-label="Quitar imagen">✕</button>
            </div>
        </div>

        <!-- Botón revisar -->
        <button class="cor-btn cor-btn-primary" id="revisarBtn" onclick="revisar()" disabled>
            Revisar texto
        </button>

        <!-- Estados -->
        <div class="cor-spinner" id="spinner" style="display:none">Analizando imagen con IA...</div>
        <div class="cor-error" id="errorMsg" style="display:none"></div>

        <!-- Resultado -->
        <div id="resultado" style="display:none"></div>
    </div>

    <script src="corrector.js"></script>
</body>
</html>
