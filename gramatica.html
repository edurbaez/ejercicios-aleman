<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gramática Alemana</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</head>
<body id="page-gram">
    <nav id="navbar">
        <a href="/">Inicio</a>
        <div class="nav-dropdown" id="navDropdown">
            <button class="nav-menu-btn" type="button" onclick="this.closest('.nav-dropdown').classList.toggle('open');event.stopPropagation()">Menú ▾</button>
            <div class="nav-dropdown-menu">
                <a href="lectura veloz.html">Lectura Veloz</a>
                <a href="diccionario.html">Diccionario</a>
                <a href="B1.html">B1</a>
                <a href="chat-voz.html">Chat de Voz</a>
                <a href="corrector.html">Corrector</a>
                <a href="kasus.html">Kasus-Trainer</a>
                <a href="gramatica.html" class="active">Gramática</a>
            </div>
        </div>
        <div class="spacer"></div>
        <button id="auth-btn" title="Iniciar sesión"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
        <button id="darkModeBtn" onclick="toggleGramDark()" title="Modo oscuro"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
    </nav>
    <script>document.addEventListener('click',function(e){if(!e.target.closest('.nav-dropdown'))document.querySelectorAll('.nav-dropdown.open').forEach(function(d){d.classList.remove('open');});});</script>

    <div class="gram-container">
        <div class="gram-header">
            <h1>Reglas Gramaticales</h1>
            <p>Las 10 reglas más importantes de cada nivel CEFR del alemán</p>
        </div>

        <div class="gram-search-wrap">
            <span class="gram-search-icon">🔍</span>
            <input id="gram-search" class="gram-search" type="search" placeholder="Buscar regla…" autocomplete="off" oninput="onSearch(this.value)">
            <button class="gram-search-clear" id="gram-search-clear" onclick="clearSearch()" title="Limpiar">✕</button>
        </div>
        <div id="gram-search-label" class="gram-search-results-label" style="display:none"></div>

        <div id="gram-level-bar" class="gram-level-bar"></div>

        <div id="gram-toolbar" class="gram-toolbar" style="display:none">
            <div class="gram-toolbar-left">
                <button class="gram-action-btn" onclick="openReview()">⚡ Repaso rápido</button>
                <button class="gram-action-btn" id="fav-filter-btn" onclick="toggleFavFilter()">☆ Favoritos</button>
            </div>
            <span id="gram-kbd-hint" style="font-size:11px;opacity:0.4">← → niveles · ↑↓ reglas · F favorito</span>
        </div>

        <div id="gram-rules" class="gram-rules-list"></div>
    </div>

    <div id="gram-review-overlay" class="gram-review-overlay" style="display:none" onclick="if(event.target===this)closeReview()">
        <div class="gram-review-card">
            <button class="gram-review-close" onclick="closeReview()">✕</button>
            <div id="rv-meta" class="gram-review-meta"></div>
            <div id="rv-title" class="gram-review-title"></div>
            <div id="rv-sub" class="gram-review-sub"></div>
            <div id="rv-tip" class="gram-review-tip"></div>
            <div class="gram-review-progress"><div id="rv-bar" class="gram-review-progress-bar" style="width:0%"></div></div>
            <div class="gram-review-nav">
                <button id="rv-prev" onclick="reviewNav(-1)">← Anterior</button>
                <span id="rv-counter" class="gram-review-counter"></span>
                <button id="rv-next" onclick="reviewNav(1)">Siguiente →</button>
            </div>
        </div>
    </div>
    <div id="gram-toast" class="gram-toast"></div>

    <!-- Exam: Loading -->
    <div id="exam-loading-overlay" class="exam-overlay" style="display:none">
        <div class="exam-loading-card">
            <h2 class="exam-loading-title">Preparando tu examen…</h2>
            <ul id="exam-rules-list" class="exam-rules-preview"></ul>
            <div id="exam-loading-spinner" class="exam-spinner"></div>
            <p id="exam-loading-error" class="exam-error" style="display:none"></p>
            <button id="exam-retry-btn" class="exam-action-btn" style="display:none" onclick="startExam()">↺ Intentar de nuevo</button>
            <button class="exam-action-btn exam-action-secondary" onclick="hideAllExamOverlays()">Cancelar</button>
        </div>
    </div>

    <!-- Exam: Question -->
    <div id="exam-question-overlay" class="exam-overlay" style="display:none">
        <div class="exam-question-card">
            <div class="exam-progress-wrap">
                <span id="exam-q-counter" class="exam-counter"></span>
                <div class="exam-progress"><div id="exam-progress-bar" class="exam-progress-bar"></div></div>
            </div>
            <div id="exam-q-body" class="exam-q-body"></div>
            <div class="exam-q-footer">
                <button id="exam-next-btn" class="exam-action-btn" style="display:none" onclick="examNext()">Siguiente →</button>
                <button class="exam-action-btn exam-action-secondary" onclick="examConfirmExit()">✕ Salir</button>
            </div>
        </div>
    </div>

    <!-- Exam: Results -->
    <div id="exam-results-overlay" class="exam-overlay" style="display:none">
        <div class="exam-results-card">
            <div id="exam-results-body" class="exam-results-body"></div>
            <div class="exam-results-actions">
                <button class="exam-action-btn" onclick="startExam()">↺ Repetir</button>
                <button id="exam-show-failed-btn" class="exam-action-btn" onclick="examShowFailedRules()">📖 Ver reglas falladas</button>
                <button class="exam-action-btn exam-action-secondary" onclick="hideAllExamOverlays()">✕ Cerrar</button>
            </div>
        </div>
    </div>

    <script src="gramatica.js"></script>
</body>
</html>
