<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasus-Trainer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</head>
<body id="page-kas">
    <nav id="navbar">
        <a href="/">Inicio</a>
        <div class="nav-dropdown" id="navDropdown">
            <button class="nav-menu-btn" type="button" onclick="this.closest('.nav-dropdown').classList.toggle('open');event.stopPropagation()">Menú ▾</button>
            <div class="nav-dropdown-menu">
                <a href="lectura veloz.html">Lectura Veloz</a>
                <a href="diccionario.html">Diccionario</a>
                <a href="B1.html">B1</a>
                <a href="chat-voz.html">Chat de Voz</a>
                <a href="corrector.html">Corrector</a>
                <a href="kasus.html" class="active">Kasus-Trainer</a>
                <a href="gramatica.html">Gramática</a>
            </div>
        </div>
        <div class="spacer"></div>
        <button id="auth-btn" title="Iniciar sesión"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
        <button id="darkModeBtn" onclick="toggleKasDark()" title="Modo oscuro"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
    </nav>
    <script>document.addEventListener('click',function(e){if(!e.target.closest('.nav-dropdown'))document.querySelectorAll('.nav-dropdown.open').forEach(function(d){d.classList.remove('open');});});</script>

    <div class="kas-container">

        <div class="kas-header">
            <h1>Kasus-Trainer</h1>
            <p>Practica los artículos y declinaciones del alemán: Nominativ, Akkusativ, Dativ y Genitiv.</p>
        </div>

        <!-- Selector de caso -->
        <div class="kas-case-selector">
            <button class="kas-case-btn active" data-caso="Todos">Todos</button>
            <button class="kas-case-btn" data-caso="Nominativ">Nominativ</button>
            <button class="kas-case-btn" data-caso="Akkusativ">Akkusativ</button>
            <button class="kas-case-btn" data-caso="Dativ">Dativ</button>
            <button class="kas-case-btn" data-caso="Genitiv">Genitiv</button>
        </div>

        <!-- Marcador -->
        <div class="kas-score-row">
            <div class="kas-score-card">
                <span class="kas-score-num" id="kas-aciertos">0</span>
                <span class="kas-score-label">Aciertos</span>
            </div>
            <div class="kas-score-card">
                <span class="kas-score-num" id="kas-errores">0</span>
                <span class="kas-score-label">Errores</span>
            </div>
            <div class="kas-score-card">
                <span class="kas-score-num" id="kas-racha">0</span>
                <span class="kas-score-label">Racha</span>
            </div>
        </div>

        <!-- Área de ejercicio -->
        <div class="kas-exercise-area" id="kas-exercise-area">
            <div class="kas-idle">
                <div class="kas-idle-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5 3" width="56" height="34" style="border-radius:3px;display:block"><rect width="5" height="1" y="0" fill="#000"/><rect width="5" height="1" y="1" fill="#DD0000"/><rect width="5" height="1" y="2" fill="#FFCE00"/></svg></div>
                <p>Selecciona un caso y pulsa <strong>Generar ejercicio</strong> para empezar.</p>
                <button class="kas-gen-btn" id="kas-gen-btn" onclick="generarEjercicio()">Generar ejercicio</button>
            </div>
        </div>

        <!-- Área de feedback -->
        <div class="kas-feedback" id="kas-feedback" style="display:none;"></div>

        <!-- Botón siguiente (aparece tras responder) -->
        <button class="kas-next-btn" id="kas-next-btn" style="display:none;" onclick="generarEjercicio()">Siguiente →</button>

    </div>

    <script>
    // ── Estado ────────────────────────────────────────
    const KasState = {
        caso:      'Todos',
        aciertos:  0,
        errores:   0,
        racha:     0,
        cargando:  false,
        ejercicio: null,
    };

    // ── Dark mode ─────────────────────────────────────
    const _moonSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';
    const _sunSVG  = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';

    (function () {
        if (localStorage.getItem('darkMode_kas') === 'true') {
            document.body.classList.add('dark');
            document.getElementById('darkModeBtn').innerHTML = _sunSVG;
        }
    })();

    function toggleKasDark() {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        document.getElementById('darkModeBtn').innerHTML = isDark ? _sunSVG : _moonSVG;
        localStorage.setItem('darkMode_kas', isDark);
    }

    // ── Selector de caso ─────────────────────────────
    document.querySelectorAll('.kas-case-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.kas-case-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            KasState.caso = btn.dataset.caso;
        });
    });

    // ── Helpers ───────────────────────────────────────
    function escHtml(s) {
        return String(s)
            .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
            .replaceAll('"','&quot;');
    }

    function updateScore() {
        document.getElementById('kas-aciertos').textContent = KasState.aciertos;
        document.getElementById('kas-errores').textContent  = KasState.errores;
        document.getElementById('kas-racha').textContent    = KasState.racha;
    }

    function showFeedback(correcto, opcionElegida, ejercicio) {
        const fb = document.getElementById('kas-feedback');
        fb.style.display = 'block';
        if (correcto) {
            fb.innerHTML = `
                <div class="kas-fb-correct">
                    <strong>¡Correcto!</strong>
                    <p class="kas-fb-exp">${escHtml(ejercicio.explicacion)}</p>
                </div>`;
        } else {
            fb.innerHTML = `
                <div class="kas-fb-wrong">
                    <strong>Incorrecto.</strong> La respuesta correcta es <em>${escHtml(ejercicio.respuesta)}</em>.
                    <p class="kas-fb-exp">${escHtml(ejercicio.explicacion)}</p>
                </div>`;
        }
    }

    // ── Generar ejercicio vía API ─────────────────────
    async function generarEjercicio() {
        if (KasState.cargando) return;
        KasState.cargando = true;
        document.getElementById('kas-feedback').style.display = 'none';
        document.getElementById('kas-next-btn').style.display = 'none';

        const area = document.getElementById('kas-exercise-area');
        area.innerHTML = `<div class="kas-loading">Generando ejercicio…</div>`;

        try {
            const token = typeof window.getAuthToken === 'function' ? await window.getAuthToken() : null;
            if (!token) {
                area.innerHTML = `<div class="kas-error">Inicia sesión para usar el Kasus-Trainer.</div>`;
                KasState.cargando = false;
                return;
            }

            const casoPrompt = KasState.caso === 'Todos'
                ? 'cualquier caso gramatical (Nominativ, Akkusativ, Dativ o Genitiv)'
                : KasState.caso;

            const temas = [
                'comida y restaurantes', 'viajes y transporte', 'familia y relaciones',
                'trabajo y oficina', 'ciudad y lugares', 'naturaleza y medio ambiente',
                'tiempo libre y hobbies', 'compras y tiendas', 'escuela y universidad',
                'salud y medicina', 'tecnología y redes sociales', 'deportes',
                'música y cultura', 'clima y estaciones', 'mascotas y animales',
            ];
            const estructuras = [
                'una oración simple y directa',
                'una oración con un complemento TEKAMOLO (primero temporal, luego causal, luego modal, luego local)',
                'una oración de relativo (Relativsatz) donde el hueco está en la cláusula principal',
                'una oración de relativo (Relativsatz) donde el hueco está dentro de la cláusula relativa',
                'una oración con preposición que rija ' + (KasState.caso === 'Todos' ? 'el caso practicado' : KasState.caso),
                'una oración con verbo modal (können, müssen, wollen, dürfen, sollen)',
                'una oración en Perfekt',
                'una oración con dos cláusulas unidas por una conjunción subordinante (weil, obwohl, wenn, dass)',
                'una oración con el orden de palabras invertido (Verb-Second con adverbio inicial)',
            ];

            const tema      = temas[Math.floor(Math.random() * temas.length)];
            const estructura = estructuras[Math.floor(Math.random() * estructuras.length)];

            const resp = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                body: JSON.stringify({
                    system: `Eres un profesor de alemán. Genera un ejercicio de rellena el hueco sobre ${casoPrompt}. El hueco debe ser un artículo o adjetivo declinado. Usa vocabulario del tema "${tema}" y construye ${estructura}. Varía el vocabulario: evita sustantivos genéricos como "Mann", "Frau", "Kind" a menos que sean imprescindibles. Devuelve SOLO JSON sin texto adicional con esta estructura exacta: {"frase":"texto con ___ para el hueco","opciones":["op1","op2","op3","op4"],"respuesta":"opción correcta","caso":"Nominativ|Akkusativ|Dativ|Genitiv","explicacion":"explicación breve en español de la regla gramatical aplicada"}. Las opciones deben ser plausibles y del mismo tipo morfológico. La respuesta debe estar entre las opciones.`,
                    messages: [{ role: 'user', content: `Genera un ejercicio de ${casoPrompt}. Tema: ${tema}. Estructura: ${estructura}.` }],
                }),
            });

            const raw = await resp.text();
            let data;
            try { data = JSON.parse(raw); } catch { throw new Error('Respuesta inválida del servidor'); }
            if (!resp.ok) throw new Error(data.error || 'Error de API');

            let ej;
            try { ej = JSON.parse(data.reply); } catch { throw new Error('El modelo devolvió JSON inválido'); }
            if (!ej.frase || !Array.isArray(ej.opciones) || !ej.respuesta) {
                throw new Error('Estructura de ejercicio incompleta');
            }

            KasState.ejercicio = ej;
            renderEjercicio(ej);

        } catch (err) {
            area.innerHTML = `<div class="kas-error">Error: ${escHtml(err.message)}. <button class="kas-gen-btn" onclick="generarEjercicio()" style="margin-top:12px;">Reintentar</button></div>`;
        } finally {
            KasState.cargando = false;
        }
    }

    // ── Renderizar ejercicio ───────────────────────────
    function renderEjercicio(ej) {
        const area = document.getElementById('kas-exercise-area');
        const partes = ej.frase.split('___');
        const fraseHtml = partes.length === 2
            ? `${escHtml(partes[0])}<span class="kas-blank">___</span>${escHtml(partes[1])}`
            : escHtml(ej.frase);

        const casoBadgeClass = {
            Nominativ: 'kas-badge-nom',
            Akkusativ: 'kas-badge-akk',
            Dativ:     'kas-badge-dat',
            Genitiv:   'kas-badge-gen',
        }[ej.caso] || 'kas-badge-nom';

        area.innerHTML = `
            <div class="kas-frase-wrap">
                <span class="kas-caso-badge ${casoBadgeClass}">${escHtml(ej.caso)}</span>
                <p class="kas-frase">${fraseHtml}</p>
            </div>
            <div class="kas-options-grid" id="kas-options-grid">
                ${ej.opciones.map((op, i) => `
                    <button class="kas-option-btn" data-opcion="${escHtml(op)}" onclick="elegirOpcion(this)">
                        <span class="kas-opt-num">${i + 1}</span> ${escHtml(op)}
                    </button>`).join('')}
            </div>`;

        // Atajos de teclado 1-4
        window._kasKeyHandler = function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const map = { '1': 0, '2': 1, '3': 2, '4': 3 };
            if (map[e.key] !== undefined) {
                const btns = document.querySelectorAll('.kas-option-btn:not([disabled])');
                if (btns[map[e.key]]) elegirOpcion(btns[map[e.key]]);
            }
        };
        document.addEventListener('keydown', window._kasKeyHandler);
    }

    // ── Evaluar respuesta ─────────────────────────────
    function elegirOpcion(btn) {
        if (!KasState.ejercicio) return;
        // Deshabilitar todos los botones
        document.querySelectorAll('.kas-option-btn').forEach(b => b.disabled = true);
        if (window._kasKeyHandler) {
            document.removeEventListener('keydown', window._kasKeyHandler);
        }

        const elegida  = btn.dataset.opcion;
        const correcto = elegida === KasState.ejercicio.respuesta;

        // Colorear opciones
        document.querySelectorAll('.kas-option-btn').forEach(b => {
            if (b.dataset.opcion === KasState.ejercicio.respuesta) {
                b.classList.add('kas-opt-correct');
            } else if (b === btn && !correcto) {
                b.classList.add('kas-opt-wrong');
            }
        });

        if (correcto) {
            KasState.aciertos++;
            KasState.racha++;
        } else {
            KasState.errores++;
            KasState.racha = 0;
        }
        updateScore();
        showFeedback(correcto, elegida, KasState.ejercicio);
        document.getElementById('kas-next-btn').style.display = 'block';

        if (typeof window.logEvent === 'function') {
            window.logEvent('kasus', 'kasus_answered', { caso: KasState.ejercicio.caso, correct: correcto });
        }
    }

    // Deep-link support: kasus.html?caso=Akkusativ
    (function () {
        const params = new URLSearchParams(location.search);
        const initCaso = params.get('caso');
        if (initCaso && ['Todos', 'Nominativ', 'Akkusativ', 'Dativ', 'Genitiv'].includes(initCaso)) {
            KasState.caso = initCaso;
            document.querySelectorAll('.kas-case-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.caso === initCaso);
            });
            generarEjercicio();
        }
    })();
    </script>
</body>
</html>
