<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diccionario Alemán</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</head>
<body id="page-dic">
    <nav id="navbar">
        <a href="/">Inicio</a>
        <div class="nav-dropdown" id="navDropdown">
            <button class="nav-menu-btn" type="button" onclick="this.closest('.nav-dropdown').classList.toggle('open');event.stopPropagation()">Menú ▾</button>
            <div class="nav-dropdown-menu">
                <a href="A1.html">Vocabulario A1</a>
                <a href="A2.html">Vocabulario A2</a>
                <a href="B1.html">Vocabulario B1</a>
                <a href="palabrasB2.html">Vocabulario B2</a>
                <a href="C1.html">Vocabulario C1</a>
                <a href="C2.html">Vocabulario C2</a>
                <a href="diccionario.html" class="active">Diccionario</a>
                <a href="lectura veloz.html">Lectura Veloz</a>
                <a href="chat-voz.html">Chat de Voz</a>
                <a href="corrector.html">Corrector</a>
                <a href="escritura.html">Escritura</a>
                <a href="kasus.html">Kasus-Trainer</a>
                <a href="gramatica.html">Gramática</a>
                <a href="chat-reformulaciones.html">Reformulaciones</a>
                <a href="plan.html">Plan 30 días</a>
            </div>
        </div>
        <div class="spacer"></div>
        <button id="auth-btn" title="Iniciar sesión" aria-label="Iniciar sesión"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
        <button id="darkModeBtn" onclick="toggleDarkMode()" title="Modo oscuro" aria-label="Modo oscuro"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
    </nav>
    <script>document.addEventListener('click',function(e){if(!e.target.closest('.nav-dropdown'))document.querySelectorAll('.nav-dropdown.open').forEach(function(d){d.classList.remove('open');});});</script>

    <div class="dic-container">
        <h1>Diccionario Alemán</h1>

        <div class="search-row">
            <div class="search-wrap">
                <input id="input-palabra" type="text" placeholder="Escribe una palabra en alemán..." autocomplete="off" />
                <div id="sugerencias"></div>
            </div>
            <button id="btn-buscar" onclick="buscar()">Buscar</button>
        </div>

        <div id="error-msg"></div>
        <div id="spinner">Consultando...</div>

        <div id="resultado">
            <div class="result-header">
                <span class="palabra-buscada" id="r-palabra"></span>
                <span class="nivel-badge" id="r-nivel"></span>
            </div>
            <div class="result-body">
                <div class="result-row">
                    <span class="result-label">Traducción</span>
                    <span class="result-value" id="r-traduccion"></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Definición</span>
                    <span class="result-value" id="r-definicion"></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Sinónimos</span>
                    <div class="result-value" id="r-sinonimos"></div>
                </div>
                <div class="result-row" id="row-antonimo">
                    <span class="result-label">Antónimo</span>
                    <span class="result-value" id="r-antonimo"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="diccionario.js"></script>
</body>
</html>
