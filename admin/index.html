<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Admin</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f7; color: #222; margin: 0; min-height: 100vh; }
    body.dark { background: #181824; color: #dde1ec; }

    /* Loading overlay */
    #loading-overlay { position: fixed; inset: 0; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 9999; font-size: 15px; color: #888; }
    body.dark #loading-overlay { background: #181824; }

    /* Header */
    .adm-header { background: #1565C0; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
    .adm-header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .2px; }
    .adm-header-actions { display: flex; gap: 10px; align-items: center; }
    .adm-btn { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.35); color: #fff; padding: 6px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: background .15s; }
    .adm-btn:hover { background: rgba(255,255,255,.28); }
    .adm-btn.danger { background: rgba(229,57,53,.5); border-color: rgba(229,57,53,.8); }
    .adm-btn.danger:hover { background: rgba(229,57,53,.75); }

    /* Main layout */
    .adm-main { padding: 24px; max-width: 1120px; margin: 0 auto; }

    /* Summary cards */
    .cards-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 20px 22px; box-shadow: 0 1px 5px rgba(0,0,0,.07); flex: 1; min-width: 160px; }
    body.dark .card { background: #23253a; box-shadow: 0 1px 5px rgba(0,0,0,.3); }
    .card-label { font-size: 12px; color: #888; font-weight: 500; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }
    .card-value { font-size: 38px; font-weight: 700; color: #1565C0; line-height: 1; }
    body.dark .card-value { color: #64b5f6; }

    /* Sections */
    .section { background: #fff; border-radius: 12px; padding: 20px 22px; box-shadow: 0 1px 5px rgba(0,0,0,.07); margin-bottom: 24px; }
    body.dark .section { background: #23253a; }
    .section-title { font-size: 15px; font-weight: 600; color: #333; margin: 0 0 16px; display: flex; align-items: center; gap: 10px; }
    body.dark .section-title { color: #dde1ec; }

    /* Bar chart */
    .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .bar-label { width: 140px; font-size: 13px; color: #555; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    body.dark .bar-label { color: #aab; }
    .bar-track { flex: 1; background: #eef0f5; border-radius: 5px; height: 22px; overflow: hidden; }
    body.dark .bar-track { background: #2e3050; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #1976D2, #42a5f5); border-radius: 5px; transition: width .5s ease; }
    .bar-count { font-size: 13px; color: #777; width: 48px; text-align: right; flex-shrink: 0; }

    /* Users table */
    .search-box { width: 100%; padding: 9px 12px; border: 1px solid #dde; border-radius: 7px; font-size: 14px; margin-bottom: 16px; outline: none; background: #f7f8fc; color: #222; }
    .search-box:focus { border-color: #1976D2; background: #fff; box-shadow: 0 0 0 2px rgba(25,118,210,.15); }
    body.dark .search-box { background: #1e2035; color: #dde1ec; border-color: #3a3d5c; }
    body.dark .search-box:focus { background: #252742; border-color: #64b5f6; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { text-align: left; padding: 8px 10px; color: #888; font-weight: 500; border-bottom: 2px solid #f0f0f5; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
    body.dark thead th { color: #7a7e9a; border-bottom-color: #2e3050; }
    tbody td { padding: 10px 10px; border-bottom: 1px solid #f5f6fa; color: #333; }
    body.dark tbody td { border-bottom-color: #2a2d45; color: #ccd1e8; }
    tbody tr.user-row { cursor: pointer; }
    tbody tr.user-row:hover td { background: #f0f6ff; }
    body.dark tbody tr.user-row:hover td { background: #272a45; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #e3f0ff; color: #1565C0; }
    body.dark .badge { background: #1a2d50; color: #64b5f6; }
    .badge.admin { background: #fff3e0; color: #e65100; }
    body.dark .badge.admin { background: #2a1e00; color: #ffb74d; }

    /* Detail panel */
    #detail-panel { display: none; background: #fff; border-radius: 12px; padding: 20px 22px; box-shadow: 0 1px 5px rgba(0,0,0,.07); margin-bottom: 24px; }
    body.dark #detail-panel { background: #23253a; }
    .detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
    .detail-name { font-size: 16px; font-weight: 600; margin: 0 0 3px; }
    .detail-email { font-size: 13px; color: #888; margin: 0 0 16px; }
    .close-btn { background: none; border: 1px solid #ddd; color: #666; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    body.dark .close-btn { border-color: #3a3d5c; color: #aab; }
    .event-row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid #f5f6fa; flex-wrap: wrap; }
    body.dark .event-row { border-bottom-color: #2a2d45; }
    .ev-time { color: #aaa; font-size: 12px; width: 140px; flex-shrink: 0; }
    .ev-app { background: #e3f0ff; color: #1565C0; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
    body.dark .ev-app { background: #1a2d50; color: #64b5f6; }
    .ev-type { font-weight: 500; font-size: 13px; color: #333; flex-shrink: 0; }
    body.dark .ev-type { color: #ccd1e8; }
    .ev-payload { font-size: 12px; color: #888; font-family: 'Menlo', 'Consolas', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }

    /* Invite form */
    .invite-row { display: flex; gap: 10px; }
    .invite-input { flex: 1; padding: 9px 12px; border: 1px solid #dde; border-radius: 7px; font-size: 14px; outline: none; background: #f7f8fc; color: #222; }
    .invite-input:focus { border-color: #1976D2; background: #fff; }
    body.dark .invite-input { background: #1e2035; color: #dde1ec; border-color: #3a3d5c; }
    .invite-submit { padding: 9px 20px; background: #1565C0; color: #fff; border: none; border-radius: 7px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .invite-submit:hover { background: #1976D2; }
    .invite-submit:disabled { opacity: .5; cursor: not-allowed; }
    #invite-msg { margin-top: 10px; font-size: 13px; display: none; padding: 8px 12px; border-radius: 6px; }
    #invite-msg.ok { background: #e8f5e9; color: #2e7d32; }
    #invite-msg.err { background: #ffebee; color: #c62828; }
    body.dark #invite-msg.ok { background: #1a3a1d; color: #81c784; }
    body.dark #invite-msg.err { background: #3a1010; color: #ef9a9a; }

    /* Empty / loading states */
    .empty { color: #aaa; font-size: 13px; padding: 16px 0; text-align: center; }

    /* Last-5-days per student */
    .student-block { margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid #f0f0f5; }
    body.dark .student-block { border-bottom-color: #2a2d45; }
    .student-block:last-child { border-bottom: none; margin-bottom: 0; }
    .student-email { font-size: 13px; font-weight: 600; color: #1565C0; margin-bottom: 6px; }
    body.dark .student-email { color: #64b5f6; }
    .student-day { font-size: 13px; color: #444; padding: 3px 0; display: flex; gap: 8px; align-items: center; }
    body.dark .student-day { color: #bcc3dc; }
    .student-day-date { font-size: 11px; color: #aaa; width: 76px; flex-shrink: 0; }
    body.dark .student-day-date { color: #6a7090; }
    .student-day-stats { display: flex; gap: 16px; flex-wrap: wrap; }
    .stat-pill { background: #f0f6ff; color: #1565C0; padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    body.dark .stat-pill { background: #1a2d50; color: #64b5f6; }
    .stat-pill.voz { background: #fce4ec; color: #c62828; }
    body.dark .stat-pill.voz { background: #3a1020; color: #ef9a9a; }
    .stat-pill.dic { background: #e8f5e9; color: #2e7d32; }
    body.dark .stat-pill.dic { background: #1a3a1d; color: #81c784; }
  </style>
</head>
<body>

<div id="loading-overlay">Verificando acceso…</div>

<div id="admin-app" style="display:none">
  <div class="adm-header">
    <h1>Dashboard de Administración</h1>
    <div class="adm-header-actions">
      <button class="adm-btn" onclick="toggleDark()">🌙 Modo oscuro</button>
      <button class="adm-btn danger" onclick="signOut()">Cerrar sesión</button>
    </div>
  </div>

  <div class="adm-main">

    <!-- 1. Resumen general -->
    <div class="cards-row">
      <div class="card">
        <div class="card-label">Usuarios registrados</div>
        <div class="card-value" id="stat-total">—</div>
      </div>
      <div class="card">
        <div class="card-label">Activos últimos 7 días</div>
        <div class="card-value" id="stat-active">—</div>
      </div>
      <div class="card">
        <div class="card-label">Total de eventos</div>
        <div class="card-value" id="stat-events">—</div>
      </div>
    </div>

    <!-- 2. Actividad por app -->
    <div class="section">
      <div class="section-title">Actividad por app</div>
      <div id="app-bars"><p class="empty">Cargando…</p></div>
    </div>

    <!-- 3. Últimos 5 días por alumno -->
    <div class="section">
      <div class="section-title">Actividad últimos 5 días por alumno</div>
      <div id="last5-container"><p class="empty">Cargando…</p></div>
    </div>

    <!-- 5. Tabla de usuarios -->
    <div class="section">
      <div class="section-title">Usuarios</div>
      <input type="search" class="search-box" id="user-search" placeholder="Buscar por nombre o email…" oninput="filterUsers(this.value)">
      <table id="users-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Registro</th>
            <th>Última actividad</th>
            <th>Eventos</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="6" class="empty">Cargando…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 6. Detalle del usuario -->
    <div id="detail-panel">
      <div class="detail-header">
        <div>
          <p class="detail-name" id="det-name">—</p>
          <p class="detail-email" id="det-email">—</p>
        </div>
        <button class="close-btn" onclick="closeDetail()">✕ Cerrar</button>
      </div>
      <div id="det-events"></div>
    </div>

    <!-- 7. Invitar alumno -->
    <div class="section">
      <div class="section-title">Invitar alumno</div>
      <div class="invite-row">
        <input type="email" class="invite-input" id="invite-email" placeholder="correo@ejemplo.com">
        <button class="invite-submit" id="invite-btn" onclick="inviteUser()">Enviar invitación</button>
      </div>
      <div id="invite-msg"></div>
    </div>

  </div>
</div>

<script>
  const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

  let allProfiles = [];
  let allEvents   = [];
  const eventsByUser = {};

  // ── Dark mode ──────────────────────────────────────────
  function toggleDark() {
    const dark = document.body.classList.toggle('dark');
    localStorage.setItem('darkMode_admin', dark ? '1' : '0');
  }
  if (localStorage.getItem('darkMode_admin') === '1') document.body.classList.add('dark');

  // ── Auth ───────────────────────────────────────────────
  async function signOut() {
    await sb.auth.signOut();
    location.href = '/';
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.href = '/'; return; }

    const { data: profile } = await sb
      .from('profiles')
      .select('role')
      .eq('id', session.user.id)
      .maybeSingle();

    if (!profile || profile.role !== 'admin') { location.href = '/'; return; }

    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('admin-app').style.display = 'block';

    await loadData();
  }

  // ── Data loading ───────────────────────────────────────
  async function loadData() {
    const [profRes, evRes] = await Promise.all([
      sb.from('profiles')
        .select('id, email, full_name, role, created_at')
        .order('created_at', { ascending: false }),
      sb.from('usage_events')
        .select('id, user_id, app, event_type, payload, created_at')
        .order('created_at', { ascending: false })
        .limit(10000),
    ]);

    allProfiles = profRes.data || [];
    allEvents   = evRes.data  || [];

    // Index events by user
    for (const e of allEvents) {
      if (!eventsByUser[e.user_id]) eventsByUser[e.user_id] = [];
      eventsByUser[e.user_id].push(e);
    }

    renderSummary();
    renderAppBars();
    renderLast5Days();
    renderUsersTable(allProfiles);
  }

  // ── Card 1: Summary ────────────────────────────────────
  function renderSummary() {
    const cutoff = new Date(Date.now() - 7 * 86400 * 1000).toISOString();
    const activeIds = new Set(
      allEvents.filter(e => e.created_at >= cutoff).map(e => e.user_id)
    );
    document.getElementById('stat-total').textContent  = allProfiles.length;
    document.getElementById('stat-active').textContent = activeIds.size;
    document.getElementById('stat-events').textContent = allEvents.length;
  }

  // ── Card 2: Activity by app ────────────────────────────
  const APP_NAMES = {
    'b2': 'Vocabulario B2',
    'b1': 'Vocabulario B1',
    'diccionario': 'Diccionario',
    'chat-voz': 'Chat de Voz',
    'lectura-veloz': 'Lectura Veloz',
  };

  function renderAppBars() {
    const counts = {};
    for (const e of allEvents) {
      const k = e.app || '(sin app)';
      counts[k] = (counts[k] || 0) + 1;
    }
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    if (sorted.length === 0) {
      document.getElementById('app-bars').innerHTML = '<p class="empty">Sin datos de actividad.</p>';
      return;
    }
    const max = sorted[0][1];
    document.getElementById('app-bars').innerHTML = sorted.map(([app, count]) => `
      <div class="bar-row">
        <span class="bar-label">${esc(APP_NAMES[app] || app)}</span>
        <div class="bar-track">
          <div class="bar-fill" style="width:${Math.round(count / max * 100)}%"></div>
        </div>
        <span class="bar-count">${count}</span>
      </div>`).join('');
  }

  // ── Last-5-days per student ────────────────────────────
  function renderLast5Days() {
    const container = document.getElementById('last5-container');

    // Only show non-admin users that have at least one event
    const students = allProfiles.filter(p => p.role !== 'admin' && eventsByUser[p.id]?.length > 0);

    if (students.length === 0) {
      container.innerHTML = '<p class="empty">Sin actividad registrada.</p>';
      return;
    }

    const blocks = students.map(p => {
      const evs = eventsByUser[p.id] || [];

      // Group events by local date string
      const byDay = {};
      for (const e of evs) {
        const day = new Date(e.created_at).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
        if (!byDay[day]) byDay[day] = [];
        byDay[day].push(e);
      }

      // Get last 5 days with activity, most-recent first
      const days = Object.keys(byDay).sort((a, b) => {
        const parse = s => { const [d,m,y] = s.split('/'); return new Date(y,m-1,d); };
        return parse(b) - parse(a);
      }).slice(0, 5);

      const dayRows = days.map(day => {
        const dayEvs = byDay[day];
        const palabras = dayEvs.filter(e => e.app === 'b1' || e.app === 'b2').length;
        const voz      = dayEvs.filter(e => e.app === 'chat-voz').length;
        const dic      = dayEvs.filter(e => e.app === 'diccionario').length;
        return `<div class="student-day">
          <span class="student-day-date">${esc(day)}</span>
          <div class="student-day-stats">
            <span class="stat-pill">palabras: ${palabras}</span>
            <span class="stat-pill voz">voz: ${voz}</span>
            <span class="stat-pill dic">diccionario: ${dic}</span>
          </div>
        </div>`;
      }).join('');

      return `<div class="student-block">
        <div class="student-email">${esc(p.email || p.full_name || p.id)}</div>
        ${dayRows}
      </div>`;
    }).join('');

    container.innerHTML = blocks;
  }

  // ── Users table ────────────────────────────────────────
  function renderUsersTable(profiles) {
    const tbody = document.getElementById('users-tbody');
    if (profiles.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">Sin usuarios.</td></tr>';
      return;
    }
    tbody.innerHTML = profiles.map(p => {
      const evs      = eventsByUser[p.id] || [];
      const lastEv   = evs[0];
      const roleBadge = p.role === 'admin'
        ? `<span class="badge admin">admin</span>`
        : `<span class="badge">alumno</span>`;
      return `<tr class="user-row" onclick="showDetail('${esc(p.id)}')">
        <td>${esc(p.full_name || '—')}</td>
        <td>${esc(p.email || '—')}</td>
        <td>${roleBadge}</td>
        <td>${fmtDate(p.created_at)}</td>
        <td>${lastEv ? fmtDate(lastEv.created_at) : '—'}</td>
        <td>${evs.length}</td>
      </tr>`;
    }).join('');
  }

  function filterUsers(q) {
    q = q.toLowerCase();
    const filtered = q
      ? allProfiles.filter(p =>
          (p.full_name || '').toLowerCase().includes(q) ||
          (p.email || '').toLowerCase().includes(q))
      : allProfiles;
    renderUsersTable(filtered);
  }

  // ── Card 4: User detail ────────────────────────────────
  function showDetail(userId) {
    const p    = allProfiles.find(x => x.id === userId);
    const evs  = (eventsByUser[userId] || []).slice(0, 300);

    document.getElementById('det-name').textContent  = p?.full_name || p?.email || userId;
    document.getElementById('det-email').textContent = p?.email || '';

    document.getElementById('det-events').innerHTML = evs.length === 0
      ? '<p class="empty">Sin eventos registrados.</p>'
      : evs.map(e => `
          <div class="event-row">
            <span class="ev-time">${fmtDateFull(e.created_at)}</span>
            <span class="ev-app">${esc(e.app || '?')}</span>
            <span class="ev-type">${esc(e.event_type || '?')}</span>
            <span class="ev-payload">${esc(JSON.stringify(e.payload || {}))}</span>
          </div>`).join('');

    const panel = document.getElementById('detail-panel');
    panel.style.display = 'block';
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function closeDetail() {
    document.getElementById('detail-panel').style.display = 'none';
  }

  // ── Invite ─────────────────────────────────────────────
  async function inviteUser() {
    const emailInput = document.getElementById('invite-email');
    const btn        = document.getElementById('invite-btn');
    const msg        = document.getElementById('invite-msg');
    const email      = emailInput.value.trim();
    if (!email) return;

    btn.disabled    = true;
    msg.style.display = 'none';

    try {
      const { data: { session } } = await sb.auth.getSession();
      const token = session?.access_token;
      const res = await fetch('/api/admin-invite', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
        },
        body: JSON.stringify({ email }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Error al enviar invitación');
      msg.textContent   = data.message || 'Invitación enviada.';
      msg.className     = 'ok';
      emailInput.value  = '';
    } catch (e) {
      msg.textContent = e.message;
      msg.className   = 'err';
    } finally {
      msg.style.display = 'block';
      btn.disabled = false;
    }
  }

  // ── Helpers ────────────────────────────────────────────
  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function fmtDateFull(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('es-ES', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  init();
</script>
</body>
</html>
