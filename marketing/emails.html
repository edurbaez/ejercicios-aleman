<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emails — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/config.js"></script>
  <script src="/grammar-data.js"></script>
  <link rel="stylesheet" href="/marketing/styles.css">
  <style>
    .main { max-width: 900px; margin: 0 auto; padding: 28px 24px 60px; }
    .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 28px; margin-bottom: 22px; }
    .panel h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .field-row { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 18px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }

    .pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill { border: 1.5px solid #d5dae6; background: #fff; color: var(--text); border-radius: 20px; padding: 6px 15px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .12s; }
    .pill:hover { border-color: var(--blue); }
    .pill.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    select, input[type=text] { border: 1.5px solid #d5dae6; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: inherit; background: #fff; color: var(--text); min-width: 220px; }
    select:focus, input:focus { outline: none; border-color: var(--blue); }

    .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .hint b { color: var(--text); }

    .vocab-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .vocab-chip { background: var(--blue-l); color: var(--blue-d); border-radius: 14px; padding: 4px 11px; font-size: 12px; font-weight: 600; }

    .btn-primary { background: var(--blue); color: #fff; border: none; border-radius: 9px; padding: 12px 26px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary:hover { background: var(--blue-d); }
    .btn-primary:disabled { opacity: .55; cursor: default; }
    .btn-secondary { background: #fff; color: var(--blue); border: 1.5px solid var(--blue); border-radius: 9px; padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-secondary:hover { background: var(--blue-l); }
    .btn-secondary:disabled { opacity: .55; cursor: default; }

    #status { font-size: 13px; color: var(--muted); margin-top: 12px; min-height: 18px; }
    #status.err { color: var(--red); font-weight: 600; }

    /* Result */
    #result { display: none; }
    .asunto-option { display: flex; align-items: flex-start; gap: 10px; border: 1.5px solid #d5dae6; border-radius: 10px; padding: 11px 14px; cursor: pointer; margin-bottom: 8px; font-size: 14px; line-height: 1.4; transition: all .12s; }
    .asunto-option:hover { border-color: var(--blue); }
    .asunto-option.selected { border-color: var(--blue); background: var(--blue-l); font-weight: 600; }
    .asunto-option .marker { flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 2px; }
    .asunto-option.selected .marker { color: var(--blue); }
    .cuerpo-box { background: var(--bg); border-radius: 10px; padding: 18px 20px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; margin-bottom: 14px; }
    #email-iframe { width: 100%; height: 520px; border: 1.5px solid #d5dae6; border-radius: 10px; background: #fff; margin-bottom: 14px; display: none; }
    .actions-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

    @media (max-width: 700px) { .field-row { flex-direction: column; gap: 14px; } select, input[type=text] { min-width: 0; width: 100%; } }
  </style>
</head>
<body>

<script>
let sb, authToken;
let currentEmail = null;      // { asuntos: [a, b], cuerpo }
let selectedAsunto = 0;
let weeklyVocab = [];         // [{ de, es }] for the resumen semanal

const SITE_URL = 'https://ejercicios-aleman.vercel.app';

const IDENTITY =
  'Eres Edward, profesor de alemán para hispanohablantes y creador de la plataforma "Ejercicios Alemán" ' +
  '(apps de vocabulario A1-C2, entrenador de casos, corrector con IA, chat de voz, plan de 30 días). ' +
  'Escribes emails en español, cercanos y profesionales, en primera persona. ' +
  'Párrafos cortos (2-3 líneas), sin jerga de marketing vacía, con un solo llamado a la acción claro al final. ' +
  'Las palabras o frases en alemán llevan traducción al español entre paréntesis. ' +
  'Respondes SOLO con JSON válido, sin markdown, con este esquema exacto: ' +
  '{"asuntos":["variante 1","variante 2"],"cuerpo":"..."}. ' +
  'Los 2 asuntos son variantes distintas del mismo email (una más directa, otra con gancho de curiosidad), máx 60 caracteres cada uno. ' +
  'El cuerpo es texto plano con saltos de línea (\\n\\n entre párrafos), incluye saludo y despedida firmada "Edward — Ejercicios Alemán". ' +
  'Si no conoces el nombre del destinatario usa el placeholder [Nombre].';

// Pricing/módulos from the capacitación table in /marketing/ (strategy page)
const SEGMENTOS = {
  academia: {
    label: 'Academia de idiomas (grupos)',
    modulos: 'Vocabulario por nivel, Kasus-Trainer, Reformulaciones, Plan 30 días',
    duracion: '1 semestre',
    precio: '€150–300/mes (hasta 20 alumnos)',
    angulo: 'complemento digital de sus clases: el profesor asigna módulos como tarea y verifica el uso desde el panel admin',
  },
  empresa: {
    label: 'Empresa DACH (onboarding de empleados)',
    modulos: 'Plan 30 días, Chat de Voz, Corrector, Vocabulario',
    duracion: '30–60 días',
    precio: '€50–80 por empleado',
    angulo: 'acelerador de integración lingüística para empleados hispanohablantes recién contratados, sin depender de clases presenciales',
  },
  certificacion: {
    label: 'Preparación certificación TELC/Goethe (individual)',
    modulos: 'Vocabulario C1/C2, Reformulaciones, Corrector, Gramática',
    duracion: '3 meses',
    precio: '€29–49/mes',
    angulo: 'preparación enfocada al examen: los módulos C1/C2 cubren contenidos evaluados en TELC y Goethe',
  },
  migrante: {
    label: 'Migrante laboral (individual)',
    modulos: 'Vocabulario A1–B1, Chat de Voz, Diccionario, Plan 30 días',
    duracion: '6 meses',
    precio: 'gratis para empezar / €9 al mes con funciones de IA',
    angulo: 'alemán práctico para la vida y el trabajo en Alemania, a su ritmo y desde el móvil',
  },
  colegio: {
    label: 'Colegio bilingüe (institucional)',
    modulos: 'Todos los niveles + Corrector + Gramática',
    duracion: 'Año escolar',
    precio: '€500–1.200/año',
    angulo: 'plataforma para todo el colegio: el corrector de redacciones ahorra horas de trabajo a los profesores',
  },
};

const $ = id => document.getElementById(id);
const getPill = (containerId, attr) => $(containerId).querySelector('.pill.active').dataset[attr];

function setupPills(containerId, onChange) {
  $(containerId).addEventListener('click', e => {
    const btn = e.target.closest('.pill');
    if (!btn) return;
    $(containerId).querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    if (onChange) onChange(btn);
  });
}

function setStatus(msg, isErr) {
  const el = $('status');
  el.textContent = msg;
  el.className = isErr ? 'err' : '';
}

async function deepseek(system, messages, maxTokens) {
  const res = await fetch('/api/deepseek-chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
    body: JSON.stringify({ system, max_tokens: maxTokens, messages }),
  });
  const raw = await res.text();
  let data;
  try { data = JSON.parse(raw); } catch { throw new Error('Respuesta no válida del servidor: ' + raw.slice(0, 200)); }
  if (!res.ok) throw new Error(data.error || 'Error del asistente');
  return data.reply;
}

function parseJsonReply(reply) {
  const clean = reply.replace(/```json/gi, '').replace(/```/g, '').trim();
  const start = clean.indexOf('{');
  const end = clean.lastIndexOf('}');
  if (start === -1 || end === -1) throw new Error('La IA no devolvió JSON');
  return JSON.parse(clean.slice(start, end + 1));
}

// ─── UI per email type ───
function updateTipoUI() {
  const tipo = getPill('tipo-pills', 'tipo');
  $('fields-bienvenida').style.display = tipo === 'bienvenida' ? '' : 'none';
  $('fields-resumen').style.display = tipo === 'resumen' ? '' : 'none';
  $('fields-promocion').style.display = tipo === 'promocion' ? '' : 'none';
  if (tipo === 'resumen' && !weeklyVocab.length) rerollVocab();
}

function fillReglas() {
  const nivel = getPill('nivel-pills', 'nivel');
  const rules = (typeof GRAMMAR_DATA !== 'undefined' && GRAMMAR_DATA[nivel]) || [];
  $('regla-select').innerHTML = rules
    .map(r => `<option value="${r.id}">${r.titulo} — ${r.subtitulo}</option>`)
    .join('');
}

function updateSegmentoInfo() {
  const s = SEGMENTOS[$('segmento-select').value];
  $('segmento-info').innerHTML =
    `<b>Módulos:</b> ${s.modulos} · <b>Duración:</b> ${s.duracion} · <b>Precio referencial:</b> ${s.precio}`;
}

async function pickRandomVocab(nivel, count) {
  const res = await fetch(`/Data${nivel}.json`);
  if (!res.ok) throw new Error(`No se pudo cargar Data${nivel}.json`);
  const data = await res.json();
  const pairs = [];
  for (const cat of Object.values(data)) {
    if (cat && Array.isArray(cat.de) && Array.isArray(cat.es)) {
      for (let i = 0; i < cat.de.length; i++) pairs.push({ de: cat.de[i], es: cat.es[i] });
    }
  }
  const picked = [];
  while (picked.length < count && pairs.length) {
    picked.push(pairs.splice(Math.floor(Math.random() * pairs.length), 1)[0]);
  }
  return picked;
}

async function rerollVocab() {
  const chips = $('vocab-chips');
  chips.innerHTML = '<span class="hint">Cargando…</span>';
  try {
    weeklyVocab = await pickRandomVocab(getPill('nivel-pills', 'nivel'), 5);
    chips.innerHTML = '';
    weeklyVocab.forEach(p => {
      const chip = document.createElement('span');
      chip.className = 'vocab-chip';
      chip.textContent = `${p.de} = ${p.es}`;
      chips.appendChild(chip);
    });
  } catch (e) {
    weeklyVocab = [];
    chips.innerHTML = `<span class="hint" style="color:var(--red)">❌ ${e.message}</span>`;
  }
}

// ─── Brief per email type ───
function buildBrief() {
  const tipo = getPill('tipo-pills', 'tipo');

  if (tipo === 'bienvenida') {
    const nombre = $('bienvenida-nombre').value.trim();
    const objetivo = $('bienvenida-objetivo').value.trim();
    return 'Email de BIENVENIDA a un alumno nuevo de mis clases de alemán. ' +
      (nombre ? `Se llama ${nombre}. ` : 'No sé su nombre (usa [Nombre]). ') +
      (objetivo ? `Su objetivo: ${objetivo}. ` : '') +
      'Contenido: darle la bienvenida a las clases, presentarle la plataforma "Ejercicios Alemán" como complemento gratuito de las clases ' +
      '(vocabulario por niveles, plan de 30 días, corrector de textos con IA, chat de voz para practicar conversación), ' +
      'y animarle a empezar por el plan de 30 días de su nivel. CTA: entrar en la plataforma y probar la primera actividad.';
  }

  if (tipo === 'resumen') {
    const nivel = getPill('nivel-pills', 'nivel');
    const rule = (GRAMMAR_DATA[nivel] || []).find(r => r.id === $('regla-select').value);
    if (!rule) throw new Error('Regla no encontrada');
    if (!weeklyVocab.length) throw new Error('No hay palabras de la semana — pulsa 🎲');
    return `Email de RESUMEN SEMANAL para mis alumnos de nivel ${nivel}. Contenido: ` +
      `1) La regla de la semana: ${rule.titulo} (${rule.subtitulo}) — ${rule.regla_base} ` +
      (rule.excepciones ? `Notas: ${rule.excepciones} ` : '') +
      'Explícala en 2-3 frases sencillas con 1 ejemplo en alemán traducido. ' +
      `2) Las 5 palabras de la semana: ${weeklyVocab.map(p => `${p.de} = ${p.es}`).join('; ')}. Preséntalas como lista. ` +
      `3) Reto de la semana: una mini-tarea concreta usando la regla y alguna de las palabras. ` +
      `CTA: practicar la regla y el vocabulario en la plataforma (app de vocabulario ${nivel} y Kasus-Trainer).`;
  }

  const s = SEGMENTOS[$('segmento-select').value];
  const dest = $('promocion-destinatario').value.trim();
  return 'Email de PROMOCIÓN de capacitación con la plataforma "Ejercicios Alemán" (email en frío pero personalizado, no agresivo). ' +
    `Destinatario: ${dest || '[Nombre]'} — segmento: ${s.label}. ` +
    `Ángulo de venta: ${s.angulo}. ` +
    `Módulos recomendados: ${s.modulos}. Duración sugerida: ${s.duracion}. Precio referencial: ${s.precio} (menciónalo con naturalidad, como orientativo). ` +
    'CTA: agendar una demo gratuita de 30 minutos o probar la plataforma 30 días sin compromiso.';
}

// ─── HTML template (Gmail-compatible: tables + inline styles) ───
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function buildEmailHtml(cuerpo) {
  const paras = escapeHtml(cuerpo.trim())
    .split(/\n{2,}/)
    .map(p => `<p style="margin:0 0 16px;font-size:15px;line-height:1.65;color:#1a1a2e;">${p.replace(/\n/g, '<br>')}</p>`)
    .join('');
  return `<!DOCTYPE html><html><body style="margin:0;padding:0;background:#f0f2f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f0f2f7;">
  <tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:10px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;">
      <tr><td style="background:#1565C0;padding:20px 32px;">
        <span style="display:inline-block;background:#ffffff;color:#1565C0;font-weight:bold;font-size:13px;border-radius:7px;padding:5px 9px;vertical-align:middle;">DE</span>
        <span style="color:#ffffff;font-size:19px;font-weight:bold;padding-left:10px;vertical-align:middle;">Ejercicios Alemán</span>
      </td></tr>
      <tr><td style="padding:30px 32px 8px;">${paras}</td></tr>
      <tr><td style="padding:4px 32px 30px;">
        <a href="${SITE_URL}" style="display:inline-block;background:#1565C0;color:#ffffff;text-decoration:none;font-weight:bold;font-size:14px;padding:12px 26px;border-radius:8px;">Ir a la plataforma →</a>
      </td></tr>
      <tr><td style="background:#f7f9fc;padding:16px 32px;border-top:1px solid #e5e9f2;">
        <p style="margin:0;font-size:12px;color:#64748b;line-height:1.6;">Edward — Ejercicios Alemán · Profesor de alemán para hispanohablantes<br>
        <a href="${SITE_URL}" style="color:#1565C0;">ejercicios-aleman.vercel.app</a></p>
      </td></tr>
    </table>
  </td></tr>
</table></body></html>`;
}

function updateResultView() {
  const view = getPill('view-pills', 'view');
  $('cuerpo-box').style.display = view === 'texto' ? '' : 'none';
  const iframe = $('email-iframe');
  iframe.style.display = view === 'html' ? 'block' : 'none';
  if (view === 'html' && currentEmail) iframe.srcdoc = buildEmailHtml(currentEmail.cuerpo);
}

async function copyHtml() {
  const html = buildEmailHtml(currentEmail.cuerpo);
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([currentEmail.cuerpo], { type: 'text/plain' }),
    })]);
    setStatus('📋 Email con formato copiado — pégalo directamente en Gmail');
  } catch {
    await navigator.clipboard.writeText(html);
    setStatus('📋 Código HTML copiado (el navegador no soporta copiado con formato)');
  }
}

// ─── Pipeline (marketing_posts) ───
function buildTema() {
  const tipo = getPill('tipo-pills', 'tipo');
  if (tipo === 'bienvenida') {
    const nombre = $('bienvenida-nombre').value.trim();
    return 'Email bienvenida' + (nombre ? ` — ${nombre}` : '');
  }
  if (tipo === 'resumen') {
    const nivel = getPill('nivel-pills', 'nivel');
    const rule = (GRAMMAR_DATA[nivel] || []).find(r => r.id === $('regla-select').value);
    return `Email resumen ${nivel}` + (rule ? ` — ${rule.titulo}` : '');
  }
  const s = SEGMENTOS[$('segmento-select').value];
  const dest = $('promocion-destinatario').value.trim();
  return `Email promoción — ${s.label}` + (dest ? ` (${dest})` : '');
}

async function saveEmail(tipo) {
  try {
    const nivel = tipo === 'resumen' ? getPill('nivel-pills', 'nivel') : null;
    const { error } = await sb.from('marketing_posts').insert({
      id: crypto.randomUUID(),
      kind: 'email',
      tema: buildTema(),
      nivel,
      contenido: { tipo, asuntos: currentEmail.asuntos, cuerpo: currentEmail.cuerpo },
      caption: null,
      estado: 'generado',
    });
    if (error) throw error;
  } catch (e) {
    console.warn('No se pudo guardar el email en el pipeline:', e.message);
  }
}

async function fetchUsedAsuntos(tipo) {
  try {
    const { data, error } = await sb.from('marketing_posts')
      .select('contenido')
      .eq('kind', 'email')
      .order('created_at', { ascending: false })
      .limit(40);
    if (error) throw error;
    return (data || [])
      .filter(r => r.contenido && r.contenido.tipo === tipo && Array.isArray(r.contenido.asuntos))
      .flatMap(r => r.contenido.asuntos)
      .slice(0, 12);
  } catch (e) {
    console.warn('No se pudo cargar el historial de asuntos:', e.message);
    return [];
  }
}

// ─── Generate & render ───
async function generar() {
  const btn = $('btn-generar');
  btn.disabled = true;
  try {
    const tipo = getPill('tipo-pills', 'tipo');
    let brief = buildBrief();
    setStatus('✍️ Generando email con DeepSeek…');
    const usados = await fetchUsedAsuntos(tipo);
    if (usados.length) {
      brief += '\n\nAsuntos ya usados en emails anteriores (NO los repitas ni escribas variantes casi idénticas): ' +
        usados.map(a => `"${a}"`).join('; ');
    }
    const reply = await deepseek(IDENTITY, [{ role: 'user', content: brief }], 1800);
    const parsed = parseJsonReply(reply);
    if (!Array.isArray(parsed.asuntos) || parsed.asuntos.length < 2 || !parsed.cuerpo) {
      throw new Error('JSON incompleto (faltan asuntos o cuerpo)');
    }
    currentEmail = { asuntos: parsed.asuntos.slice(0, 2), cuerpo: parsed.cuerpo };
    selectedAsunto = 0;
    renderResult();
    setStatus('✅ Email generado y guardado en el pipeline');
    saveEmail(tipo);
  } catch (e) {
    setStatus('❌ ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

function renderResult() {
  const list = $('asuntos-list');
  list.innerHTML = '';
  currentEmail.asuntos.forEach((asunto, i) => {
    const opt = document.createElement('div');
    opt.className = 'asunto-option' + (i === selectedAsunto ? ' selected' : '');
    const marker = document.createElement('span');
    marker.className = 'marker';
    marker.textContent = i === selectedAsunto ? '●' : '○';
    const txt = document.createElement('span');
    txt.textContent = asunto;
    opt.append(marker, txt);
    opt.onclick = () => { selectedAsunto = i; renderResult(); };
    list.appendChild(opt);
  });
  $('cuerpo-box').textContent = currentEmail.cuerpo;
  updateResultView();
  $('result').style.display = 'block';
  $('result').scrollIntoView({ behavior: 'smooth' });
}

async function copyText(text, msg) {
  await navigator.clipboard.writeText(text);
  setStatus(msg);
}

// ─── Init ───
(async () => {
  sb = window.supabase.createClient(window.SUPA_URL, window.SUPA_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = '/'; return; }

  const { data: profile } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
  if (!profile || profile.role !== 'admin') { location.href = '/'; return; }
  authToken = session.access_token;

  setupPills('tipo-pills', updateTipoUI);
  setupPills('nivel-pills', () => { fillReglas(); rerollVocab(); });
  setupPills('view-pills', updateResultView);

  $('segmento-select').innerHTML = Object.entries(SEGMENTOS)
    .map(([key, s]) => `<option value="${key}">${s.label}</option>`)
    .join('');
  $('segmento-select').onchange = updateSegmentoInfo;
  updateSegmentoInfo();

  fillReglas();
  updateTipoUI();

  $('btn-vocab-reroll').onclick = rerollVocab;
  $('btn-generar').onclick = generar;
  $('btn-copy-asunto').onclick = () => copyText(currentEmail.asuntos[selectedAsunto], '📋 Asunto copiado');
  $('btn-copy-cuerpo').onclick = () => copyText(currentEmail.cuerpo, '📋 Cuerpo copiado');
  $('btn-copy-todo').onclick = () =>
    copyText(`Asunto: ${currentEmail.asuntos[selectedAsunto]}\n\n${currentEmail.cuerpo}`, '📋 Email completo copiado');
  $('btn-copy-html').onclick = copyHtml;

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.addEventListener('click', e => {
    const wrap = document.getElementById('nav-menu-wrap');
    if (wrap && !wrap.contains(e.target)) wrap.classList.remove('open');
  });
})();
</script>
